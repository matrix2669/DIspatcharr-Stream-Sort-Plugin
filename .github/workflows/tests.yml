name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REQUIRE_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip pytest
      - run: python -Werror -m compileall -q stream_sorter tests
      - run: python -m pytest
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-admin
          POSTGRES_DB: stream_sort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_POSTGRES_TESTS: '1'
      STREAM_SORT_TEST_DB: stream_sort_test
      STREAM_SORT_TEST_USER: stream_sort_test
      STREAM_SORT_TEST_PASSWORD: disposable-test
      STREAM_SORT_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Grant plugin table ownership to restricted disposable role
        env:
          PGPASSWORD: disposable-admin
        run: >-
          psql -h 127.0.0.1 -U postgres -d stream_sort_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE stream_sort_test LOGIN PASSWORD 'disposable-test' NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT CONNECT ON DATABASE stream_sort_test TO stream_sort_test; GRANT USAGE, CREATE ON SCHEMA public TO stream_sort_test;"
      - run: python -m pytest -v tests/integration/test_postgres.py
